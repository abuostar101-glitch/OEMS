<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Exam Result</title>
    <style>
        body {
            font-family: Arial;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <h2>📊 Exam Result Summary</h2>
    <p><strong>Student:</strong> {UserName}</p>
    <p><strong>Subject:</strong> {SubjectId}</p>
    <table>
        <tr><th>Score</th><td>{Score}</td></tr>
        <tr><th>Percentage</th><td>{Percentage}%</td></tr>
        <tr><th>Result</th><td>{Result}</td></tr>
        <tr><th>Exam Date</th><td>{ExamDate}</td></tr>
        <tr><th>Submitted At</th><td>{SubmittedAt}</td></tr>
    </table>
</body>
</html>
